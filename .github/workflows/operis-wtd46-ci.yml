name: OPERIS WTD46 Cloud Validation

on:
  push:
    branches:
      - postgresql-candidate-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operis-wtd46-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-validation:
    name: Windows 2022 PostgreSQL-only validation
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://operis:operis_ci_password@127.0.0.1:5432/operis_ci?schema=public
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          npm.cmd --prefix server ci --no-audit --no-fund

      - name: PostgreSQL-only structural contracts
        shell: pwsh
        run: |
          node tests/ci/postgresql-only-contract.cjs
          node tests/verify-wtd58-backup-restore-gates.cjs
          node tests/ci/startup-postgresql-readiness-contract.cjs
          node tests/ci/tbldemirmas-db-outage-contract.cjs

      - name: Generate canonical Prisma client
        shell: pwsh
        run: npm.cmd --prefix server run prisma:generate

      - name: Typecheck and build
        shell: pwsh
        run: |
          npm run typecheck
          npm run build
          npm.cmd --prefix server run build

      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem . -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens=$null; $errors=$null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count){ throw "PowerShell parse failed: $($_.FullName) :: $($errors[0].Message)" }
          }

      - name: Validate Windows installer contract
        shell: pwsh
        run: .\tests\windows\install-contract-smoke.ps1

      - name: Verify firewall idempotency contract
        shell: pwsh
        run: node .\tests\windows\firewall-runtime.cjs
