name: OPERIS Release Smoke cfadd

on:
  push:
    branches:
      - release-smoke-cfadd

permissions:
  contents: read

jobs:
  first-install-exe:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Build real setup EXE
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          New-Item -ItemType Directory -Path .\dist\installer -Force | Out-Null
          & $iscc .\installer\OPERIS.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }

      - name: Run first-install EXE and expose failure immediately
        shell: pwsh
        run: |
          $exe = (Resolve-Path '.\dist\installer\OPERIS_Setup_v6.3.63.exe').Path
          $setupLog = Join-Path $env:RUNNER_TEMP 'operis-release-smoke-setup.log'
          $p = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',("/LOG=$setupLog") -Wait -PassThru
          Write-Host "SETUP_EXIT=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            foreach ($log in @($setupLog, 'C:\ProgramData\Operis\Logs\Install.log', 'C:\ProgramData\Operis\Logs\Install-Transcript.log')) {
              if (Test-Path $log) { Write-Host "===== $log ====="; Get-Content $log -Tail 250 }
            }
            throw "Setup EXE failed: exit=$($p.ExitCode)"
          }
          $binding = 'C:\ProgramData\Operis\Data\NetworkBinding.json'
          for ($i=0; $i -lt 60 -and -not (Test-Path $binding); $i++) { Start-Sleep -Seconds 2 }
          if (-not (Test-Path $binding)) {
            foreach ($log in @($setupLog, 'C:\ProgramData\Operis\Logs\Install.log', 'C:\ProgramData\Operis\Logs\Install-Transcript.log')) {
              if (Test-Path $log) { Write-Host "===== $log ====="; Get-Content $log -Tail 250 }
            }
            throw 'NetworkBinding.json missing after successful setup exit.'
          }
          $b = Get-Content $binding -Raw | ConvertFrom-Json
          $ok = $false
          $last = $null
          for ($i=0; $i -lt 30; $i++) {
            try {
              $h = Invoke-RestMethod -Uri "http://$($b.ipAddress):$($b.port)/api/health" -TimeoutSec 5
              if ($h.ok -and $h.database.provider -eq 'postgresql' -and $h.database.connected) { $ok = $true; break }
              $last = $h | ConvertTo-Json -Compress
            } catch { $last = $_.Exception.Message }
            Start-Sleep -Seconds 2
          }
          if (-not $ok) { throw "Health failed: $last" }
          Write-Output 'RELEASE_FIRST_INSTALL_EXE_SMOKE_PASS'

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-smoke-cfadd-logs
          path: |
            ${{ runner.temp }}/operis-release-smoke-setup.log
            C:\ProgramData\Operis\Logs\Install.log
            C:\ProgramData\Operis\Logs\Install-Transcript.log
          if-no-files-found: warn
