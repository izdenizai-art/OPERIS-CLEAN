name: OPERIS PostgreSQL Candidate Validation

on:
  push:
    branches:
      - postgresql-candidate-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operis-postgresql-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgresql-candidate:
    name: PostgreSQL-only schema + runtime validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: operis_candidate
          POSTGRES_USER: operis
          POSTGRES_PASSWORD: operis_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U operis -d operis_candidate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://operis:operis_ci_password@127.0.0.1:5432/operis_candidate?schema=public
      PORT: "3002"
      BIND_HOST: "127.0.0.1"
      NODE_ENV: test
      COOKIE_SECURE: "false"
      PUBLIC_URL: http://127.0.0.1:3002
      CLIENT_ORIGIN: http://127.0.0.1:3002

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix server ci --no-audit --no-fund

      - name: PostgreSQL-only contract
        run: node tests/ci/postgresql-only-contract.cjs

      - name: Validate and generate canonical Prisma schema
        working-directory: server
        run: |
          npx prisma validate
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Apply PostgreSQL custom indexes
        env:
          PGPASSWORD: operis_ci_password
        run: |
          psql -h 127.0.0.1 -U operis -d operis_candidate -v ON_ERROR_STOP=1 -f migration/postgresql-custom.sql

      - name: Verify table and index contract
        env:
          PGPASSWORD: operis_ci_password
        run: |
          tables="$(psql -h 127.0.0.1 -U operis -d operis_candidate -Atqc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';")"
          test "$tables" = "50"
          serial_index="$(psql -h 127.0.0.1 -U operis -d operis_candidate -Atqc "SELECT COUNT(*) FROM pg_indexes WHERE schemaname='public' AND indexname='Asset_active_serialNumber_unique';")"
          barcode_index="$(psql -h 127.0.0.1 -U operis -d operis_candidate -Atqc "SELECT COUNT(*) FROM pg_indexes WHERE schemaname='public' AND indexname='Asset_active_barcode_unique';")"
          test "$serial_index" = "1"
          test "$barcode_index" = "1"

      - name: Build application
        run: |
          npm run build
          npm --prefix server run build

      - name: Start PostgreSQL runtime
        shell: bash
        run: |
          node server/dist/index.js > "$RUNNER_TEMP/operis-postgresql-runtime.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/operis-postgresql-runtime.pid"
          for i in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:3002/api/health > "$RUNNER_TEMP/operis-postgresql-health.json"; then
              break
            fi
            sleep 1
          done
          node -e "const f=require('fs');const x=JSON.parse(f.readFileSync(process.argv[1]));if(!x.ok||x.database?.provider!=='postgresql'||x.database?.connected!==true){console.error(x);process.exit(1)}" "$RUNNER_TEMP/operis-postgresql-health.json"

      - name: Stop runtime
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/operis-postgresql-runtime.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/operis-postgresql-runtime.pid")" || true
          fi

      - name: Upload PostgreSQL candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: operis-postgresql-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/operis-postgresql-health.json
            ${{ runner.temp }}/operis-postgresql-runtime.log
          if-no-files-found: warn
          retention-days: 14
