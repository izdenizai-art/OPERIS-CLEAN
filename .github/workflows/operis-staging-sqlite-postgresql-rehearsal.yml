name: OPERIS Staging SQLite to PostgreSQL Rehearsal

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "EXACT: I_CONFIRM_STAGING_COPY_ONLY"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: operis-staging-sqlite-postgresql-rehearsal
  cancel-in-progress: false

jobs:
  staging-copy-rehearsal:
    name: Real SQLite copy -> isolated staging PostgreSQL
    runs-on: [self-hosted, windows, operis-staging]
    environment: operis-staging
    timeout-minutes: 90

    env:
      OPERIS_SQLITE_FILE: ${{ vars.OPERIS_STAGING_SQLITE_FILE }}
      OPERIS_POSTGRES_URL: ${{ secrets.OPERIS_STAGING_POSTGRES_URL }}
      OPERIS_EXPECTED_TARGET_DATABASE: ${{ vars.OPERIS_STAGING_TARGET_DB }}
      OPERIS_REHEARSAL_CONFIRM: ${{ inputs.confirmation }}
      DATABASE_URL: ${{ secrets.OPERIS_STAGING_POSTGRES_URL }}

    steps:
      - name: Safety gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ("${{ github.ref }}" -ne "refs/heads/postgresql-candidate-validation") {
            throw "Bu rehearsal yalniz postgresql-candidate-validation branch'inde calistirilabilir."
          }

          if ($env:OPERIS_REHEARSAL_CONFIRM -ne "I_CONFIRM_STAGING_COPY_ONLY") {
            throw "Gecersiz staging onayi."
          }

          foreach ($name in @('OPERIS_SQLITE_FILE', 'OPERIS_POSTGRES_URL', 'OPERIS_EXPECTED_TARGET_DATABASE')) {
            if (-not (Get-Item "Env:$name").Value) {
              throw "$name tanimli degil."
            }
          }

          $sourceItem = Get-Item -LiteralPath $env:OPERIS_SQLITE_FILE -ErrorAction Stop
          if ($sourceItem.PSIsContainer) {
            throw "SQLite kaynagi dosya olmali."
          }
          if (($sourceItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw "GUVENLIK BLOGU: rehearsal SQLite kaynagi symbolic link/reparse point olamaz."
          }

          $source = [IO.Path]::GetFullPath($sourceItem.FullName)
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\') + '\'
          if ($source.StartsWith($workspace, [StringComparison]::OrdinalIgnoreCase)) {
            throw "GUVENLIK BLOGU: gercek SQLite rehearsal kaynagi GITHUB_WORKSPACE disinda olmalidir."
          }

          $sourceHash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
          "OPERIS_SOURCE_SHA256=$sourceHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"

      - name: Locate PostgreSQL Windows client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $command = Get-Command psql.exe -ErrorAction SilentlyContinue
          if ($command) {
            $psql = $command.Source
          } else {
            $candidates = @(
              Get-ChildItem -Path "$env:ProgramFiles\PostgreSQL\*\bin\psql.exe" -File -ErrorAction SilentlyContinue
            ) | Sort-Object FullName -Descending
            if ($candidates.Count -lt 1) {
              throw "psql.exe bulunamadi. Windows PostgreSQL client/server kurulumu gerekli."
            }
            $psql = $candidates[0].FullName
          }

          & $psql --version
          if ($LASTEXITCODE -ne 0) {
            throw "psql.exe calismiyor: exit=$LASTEXITCODE"
          }
          "OPERIS_PSQL=$psql" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify exact target database and refuse non-empty target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $uri = [Uri]$env:DATABASE_URL
          $userInfo = $uri.UserInfo.Split(':', 2)
          if ($userInfo.Count -ne 2) {
            throw "PostgreSQL URL user/password bilgisi gecersiz."
          }

          $env:PGHOST = $uri.Host
          $env:PGPORT = if ($uri.Port -gt 0) { [string]$uri.Port } else { '5432' }
          $env:PGUSER = [Uri]::UnescapeDataString($userInfo[0])
          $env:PGPASSWORD = [Uri]::UnescapeDataString($userInfo[1])
          $env:PGDATABASE = [Uri]::UnescapeDataString($uri.AbsolutePath.TrimStart('/'))

          if ($env:PGDATABASE -ne $env:OPERIS_EXPECTED_TARGET_DATABASE) {
            throw "Target identity mismatch."
          }

          $currentDatabase = (& $env:OPERIS_PSQL -X -v ON_ERROR_STOP=1 -Atqc "SELECT current_database();").Trim()
          if ($LASTEXITCODE -ne 0 -or $currentDatabase -ne $env:OPERIS_EXPECTED_TARGET_DATABASE) {
            throw "PostgreSQL current_database() exact target dogrulamasi basarisiz."
          }

          $tableCount = (& $env:OPERIS_PSQL -X -v ON_ERROR_STOP=1 -Atqc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';").Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "PostgreSQL target table count sorgusu basarisiz."
          }
          if ($tableCount -ne '0') {
            throw "GUVENLIK BLOGU: staging target DB bos degil. table_count=$tableCount"
          }

      - name: Install server dependencies
        working-directory: server
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Create PostgreSQL schema only
        working-directory: server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npx prisma generate --schema prisma/schema.postgresql.prisma
          if ($LASTEXITCODE -ne 0) { throw "prisma generate failed: exit=$LASTEXITCODE" }
          npx prisma db push --schema prisma/schema.postgresql.prisma --skip-generate
          if ($LASTEXITCODE -ne 0) { throw "prisma db push failed: exit=$LASTEXITCODE" }

      - name: Run Windows-native SQLite to PostgreSQL migration
        shell: pwsh
        env:
          OPERIS_CONFIRM_SQLITE_MIGRATION: "YES"
          OPERIS_SQLITE_MIGRATION_SOURCE: ${{ vars.OPERIS_STAGING_SQLITE_FILE }}
          OPERIS_MIGRATION_EVIDENCE: ${{ runner.temp }}\operis-staging-migration-evidence.json
          OPERIS_REHEARSAL_LOG: ${{ runner.temp }}\operis-staging-rehearsal.log
        run: |
          $ErrorActionPreference = 'Stop'
          & node .\server\scripts\migrate-sqlite-windows.mjs *>&1 | Tee-Object -FilePath $env:OPERIS_REHEARSAL_LOG
          if ($LASTEXITCODE -ne 0) {
            throw "Windows SQLite->PostgreSQL migration failed: exit=$LASTEXITCODE"
          }

          $evidence = Get-Content -LiteralPath $env:OPERIS_MIGRATION_EVIDENCE -Raw | ConvertFrom-Json
          if ($evidence.result -ne 'PASS' -or $evidence.verification -ne 'FULL_ROWS_AND_PRIMARY_KEYS') {
            throw "Migration evidence PASS/FULL_ROWS_AND_PRIMARY_KEYS degil."
          }

      - name: Final PostgreSQL structural checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $uri = [Uri]$env:DATABASE_URL
          $userInfo = $uri.UserInfo.Split(':', 2)
          $env:PGHOST = $uri.Host
          $env:PGPORT = if ($uri.Port -gt 0) { [string]$uri.Port } else { '5432' }
          $env:PGUSER = [Uri]::UnescapeDataString($userInfo[0])
          $env:PGPASSWORD = [Uri]::UnescapeDataString($userInfo[1])
          $env:PGDATABASE = [Uri]::UnescapeDataString($uri.AbsolutePath.TrimStart('/'))

          $tables = (& $env:OPERIS_PSQL -X -v ON_ERROR_STOP=1 -Atqc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';").Trim()
          $invalidFks = (& $env:OPERIS_PSQL -X -v ON_ERROR_STOP=1 -Atqc "SELECT COUNT(*) FROM pg_constraint WHERE contype='f' AND NOT convalidated;").Trim()
          $serialIndex = (& $env:OPERIS_PSQL -X -v ON_ERROR_STOP=1 -Atqc "SELECT COUNT(*) FROM pg_indexes WHERE schemaname='public' AND indexname='Asset_active_serialNumber_unique';").Trim()
          $barcodeIndex = (& $env:OPERIS_PSQL -X -v ON_ERROR_STOP=1 -Atqc "SELECT COUNT(*) FROM pg_indexes WHERE schemaname='public' AND indexname='Asset_active_barcode_unique';").Trim()

          if ($tables -ne '50') { throw "Beklenen 50 tablo, bulunan $tables." }
          if ($invalidFks -ne '0') { throw "Dogrulanmamis foreign key var: $invalidFks." }
          if ($serialIndex -ne '1') { throw "Asset_active_serialNumber_unique index bulunamadi." }
          if ($barcodeIndex -ne '1') { throw "Asset_active_barcode_unique index bulunamadi." }

      - name: Verify source SQLite remained byte-for-byte unchanged
        shell: pwsh
        env:
          OPERIS_MIGRATION_EVIDENCE: ${{ runner.temp }}\operis-staging-migration-evidence.json
        run: |
          $ErrorActionPreference = 'Stop'
          $after = (Get-FileHash -LiteralPath $env:OPERIS_SQLITE_FILE -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($after -ne $env:OPERIS_SOURCE_SHA256) {
            throw "SQLite source hash changed during rehearsal."
          }

          $evidence = Get-Content -LiteralPath $env:OPERIS_MIGRATION_EVIDENCE -Raw | ConvertFrom-Json
          if ($evidence.sourceSha256 -ne $after) {
            throw "Migration evidence source hash mismatch."
          }
          Write-Host "SOURCE_SQLITE_UNCHANGED_PASS"

      - name: Upload non-sensitive rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: operis-staging-rehearsal-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\operis-staging-rehearsal.log
            ${{ runner.temp }}\operis-staging-migration-evidence.json
          if-no-files-found: warn
          retention-days: 14
