name: OPERIS Concurrent Capacity Validation

on:
  workflow_dispatch:
    inputs:
      max_users:
        description: "Maximum concurrent active users"
        required: true
        default: "750"
        type: choice
        options: ["75", "100", "150", "300", "500", "750"]
      mode:
        description: "Active-user workload"
        required: true
        default: "normal"
        type: choice
        options: [normal, helpdesk, mixed]
      environment_confirmation:
        description: "EXACT: I_CONFIRM_NON_PRODUCTION"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: operis-capacity-staging
  cancel-in-progress: false

jobs:
  capacity:
    runs-on: [self-hosted, windows, operis-staging]
    environment: operis-staging
    timeout-minutes: 45
    env:
      DATABASE_URL: \${{ secrets.OPERIS_STAGING_POSTGRES_URL }}
      OPERIS_BASE_URL: \${{ vars.OPERIS_STAGING_BASE_URL }}
      OPERIS_BRANCH_CODE: "100"
      OPERIS_CAPACITY_MAX_USERS: \${{ inputs.max_users }}
      OPERIS_CAPACITY_USER_COUNT: \${{ inputs.max_users }}
      OPERIS_LOAD_MODE: \${{ inputs.mode }}

    steps:
      - uses: actions/checkout@v6

      - name: Safety gate
        shell: pwsh
        run: |
          if ("\${{ github.ref }}" -ne "refs/heads/postgresql-candidate-validation") { throw "Candidate branch required." }
          if ("\${{ inputs.environment_confirmation }}" -ne "I_CONFIRM_NON_PRODUCTION") { throw "Non-production confirmation required." }
          if (-not $env:OPERIS_BASE_URL) { throw "OPERIS_STAGING_BASE_URL is missing." }
          if (-not $env:DATABASE_URL -or $env:DATABASE_URL -notmatch '^postgres(ql)?://') { throw "PostgreSQL staging URL is required." }

      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"

      - name: Install server dependencies
        shell: pwsh
        run: npm.cmd --prefix server ci --no-audit --no-fund

      - name: Create temporary capacity credentials
        shell: pwsh
        run: |
          $bytes = [Security.Cryptography.RandomNumberGenerator]::GetBytes(32)
          $password = [Convert]::ToBase64String($bytes)
          Write-Output "::add-mask::$password"
          "OPERIS_CAPACITY_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Seed isolated capacity users
        shell: pwsh
        run: node server/scripts/seed-capacity-users.mjs

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run capacity ladder
        shell: pwsh
        run: |
          k6 run .\tests\load\operis-capacity.js
          if ($LASTEXITCODE -ne 0) { throw "Capacity thresholds failed: exit=$LASTEXITCODE" }

      - name: Cleanup temporary capacity users
        if: always()
        shell: pwsh
        env:
          OPERIS_CAPACITY_ACTION: cleanup
        run: node server/scripts/seed-capacity-users.mjs

      - name: Upload capacity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: operis-capacity-\${{ inputs.mode }}-\${{ inputs.max_users }}-\${{ github.run_id }}
          path: operis-capacity-summary.json
          if-no-files-found: warn
          retention-days: 30
