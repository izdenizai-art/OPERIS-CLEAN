name: Apply CI-Only Forced Rollback Validation Hook

on:
  push:
    branches: [ production-update-hardening-eee04356 ]
    paths: [ '.github/workflows/apply-production-hardening.yml' ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: production-update-hardening-eee04356
          fetch-depth: 0
      - name: Add GitHub Actions only forced failure hook
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('windows/install-enterprise.ps1')
          s = p.read_text(encoding='utf-8-sig')
          old = '''    Write-Step "Uygulama dosyaları C:\\ProgramData\\Operis dizinine kuruluyor"\n    Copy-ApplicationFiles $backupFolder\n    Ensure-Directories\n'''
          new = '''    Write-Step "Uygulama dosyaları C:\\ProgramData\\Operis dizinine kuruluyor"\n    Copy-ApplicationFiles $backupFolder\n    if ($env:GITHUB_ACTIONS -eq 'true' -and $env:OPERIS_TEST_FORCE_UPDATE_FAILURE -eq 'AFTER_COPY') {\n        throw 'OPERIS_TEST_FORCED_UPDATE_FAILURE'\n    }\n    Ensure-Directories\n'''
          if old not in s:
              raise SystemExit('Application copy block missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8-sig')
          PY
          git config user.name "izdenizai-art"
          git config user.email "izdenizai@gmail.com"
          git add windows/install-enterprise.ps1
          git diff --cached --check
          git commit -m "Add CI-only forced rollback validation hook"
          git push origin HEAD:production-update-hardening-eee04356
