name: OPERIS Release Phased Diagnostic

on:
  push:
    branches:
      - release-phased-diagnostic-eee04356
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phased-diagnostic:
    name: Phased EXE lifecycle diagnostic
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
      - name: Install Inno Setup compiler when missing
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe bulunamadi.' }
      - name: Build real Windows setup EXE from candidate source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\dist\installer -Force | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' .\installer\OPERIS.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed: exit=$LASTEXITCODE" }
      - name: Phase 1 clean install
        shell: pwsh
        run: .\tests\windows\setup-exe-phased-diagnostic.ps1 -Phase clean -SetupExe (Resolve-Path .\dist\installer\OPERIS_Setup_v6.3.63.exe).Path
      - name: Phase 2 reinstall
        shell: pwsh
        run: .\tests\windows\setup-exe-phased-diagnostic.ps1 -Phase reinstall -SetupExe (Resolve-Path .\dist\installer\OPERIS_Setup_v6.3.63.exe).Path
      - name: Phase 3 simulated upgrade
        shell: pwsh
        run: .\tests\windows\setup-exe-phased-diagnostic.ps1 -Phase upgrade -SetupExe (Resolve-Path .\dist\installer\OPERIS_Setup_v6.3.63.exe).Path
      - name: Phase 4 repair
        shell: pwsh
        run: .\tests\windows\setup-exe-phased-diagnostic.ps1 -Phase repair -SetupExe (Resolve-Path .\dist\installer\OPERIS_Setup_v6.3.63.exe).Path
      - name: Phase 5 startup backup restore
        shell: pwsh
        run: .\tests\windows\setup-exe-phased-diagnostic.ps1 -Phase startup-backup -SetupExe (Resolve-Path .\dist\installer\OPERIS_Setup_v6.3.63.exe).Path
      - name: Phase 6 uninstall survival
        shell: pwsh
        run: .\tests\windows\setup-exe-phased-diagnostic.ps1 -Phase uninstall -SetupExe (Resolve-Path .\dist\installer\OPERIS_Setup_v6.3.63.exe).Path
      - name: Phase 7 reinstall after uninstall
        shell: pwsh
        run: .\tests\windows\setup-exe-phased-diagnostic.ps1 -Phase db-survival-reinstall -SetupExe (Resolve-Path .\dist\installer\OPERIS_Setup_v6.3.63.exe).Path
      - name: Upload phased diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: operis-release-phased-diagnostic
          path: |
            ${{ runner.temp }}/operis-phased-state.json
            ${{ runner.temp }}/operis-phased-evidence.json
            C:/ProgramData/Operis/Logs/*.log
          if-no-files-found: warn
