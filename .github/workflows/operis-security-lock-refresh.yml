name: OPERIS Security Lock Refresh

on:
  push:
    branches:
      - postgresql-candidate-validation

permissions:
  contents: write

jobs:
  refresh-server-lock:
    if: contains(github.event.head_commit.message, '[security-lock-refresh]')
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
      - name: Regenerate and verify secure server lock
        shell: pwsh
        run: |
          Push-Location server
          try {
            npm install --package-lock-only --ignore-scripts
            if ($LASTEXITCODE -ne 0) { throw "npm lock refresh failed: exit=$LASTEXITCODE" }
            npm ci --ignore-scripts
            if ($LASTEXITCODE -ne 0) { throw "npm ci failed: exit=$LASTEXITCODE" }
            npx prisma generate
            if ($LASTEXITCODE -ne 0) { throw "prisma generate failed: exit=$LASTEXITCODE" }
            npm audit --omit=dev --audit-level=high
            if ($LASTEXITCODE -ne 0) { throw "npm audit failed: exit=$LASTEXITCODE" }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw "server build failed: exit=$LASTEXITCODE" }
          }
          finally { Pop-Location }
      - name: Commit verified lock and remove one-time workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package-lock.json
          git rm .github/workflows/operis-security-lock-refresh.yml
          if (-not (git status --porcelain)) { throw 'Expected lock/workflow changes were not produced.' }
          git commit -m "Lock secure server dependency graph [lock-finalized]"
          if ($LASTEXITCODE -ne 0) { throw "git commit failed: exit=$LASTEXITCODE" }
          git push origin HEAD:postgresql-candidate-validation
          if ($LASTEXITCODE -ne 0) { throw "git push failed: exit=$LASTEXITCODE" }
