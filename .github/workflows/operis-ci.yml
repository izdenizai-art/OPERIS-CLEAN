name: OPERIS Final CI

on:
  push:
    branches: ["main", "master", "postgresql-candidate-validation"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: operis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression / Locked Modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
      - run: node tests/verify-regression-baseline.cjs

  frontend:
    name: Frontend TypeScript + Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
      - run: npm ci --no-audit --no-fund
      - run: node tests/ci/settings-and-static-asset-regression.cjs
      - run: npm run typecheck
      - run: npx vite build
      - run: node tests/ci/verify-frontend-css-build.cjs

  backend:
    name: Backend + PostgreSQL Prisma
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: operis_ci
          POSTGRES_USER: operis
          POSTGRES_PASSWORD: operis_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U operis -d operis_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://operis:operis_ci_password@127.0.0.1:5432/operis_ci?schema=public
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
      - name: Install backend dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: PostgreSQL-only contract
        run: node tests/ci/postgresql-only-contract.cjs
      - name: Prisma validate
        working-directory: server
        run: npx prisma validate
      - name: Prisma generate
        working-directory: server
        run: npx prisma generate
      - name: Create PostgreSQL schema
        working-directory: server
        run: npx prisma db push --skip-generate
      - name: Backend build
        working-directory: server
        run: npm run build

  helpdesk-guards:
    name: Help Desk Structural Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
      - run: node tests/verify-helpdesk-structure.cjs

  progress-ui:
    name: Windows Progress UI Contract + Runtime
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Progress UI contract
        shell: powershell
        run: .\tests\windows\progress-ui-contract.ps1
      - name: Progress UI runtime
        shell: powershell
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'progress-ui-evidence.json'
          powershell.exe -STA -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tests\windows\progress-ui-runtime.ps1 -EvidencePath $evidence
          if ($LASTEXITCODE -ne 0) { throw "Progress UI runtime failed: exit=$LASTEXITCODE" }
