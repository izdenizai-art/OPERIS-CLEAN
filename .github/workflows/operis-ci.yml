name: OPERIS Final CI

on:
  push:
    branches: ["main", "master", "postgresql-candidate-validation"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: operis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression / Kilitli Modüller
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@v6

      - name: Node.js 24.21.0
        uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"

      - name: Kritik çalışan modülleri hash ile doğrula
        run: node tests/verify-regression-baseline.cjs

  frontend:
    name: Frontend TypeScript + Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@v6

      - name: Node.js 24.21.0
        uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"

      - name: Frontend bağımlılıklarını kur
        run: npm ci --no-audit --no-fund

      - name: TypeScript kontrolü
        run: npm run typecheck

      - name: Production build
        run: npx vite build

  backend:
    name: Backend + Prisma
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - name: Repository checkout
        uses: actions/checkout@v6

      - name: Node.js 24.21.0
        uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"

      - name: Backend bağımlılıklarını kur
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: ZIP restore compatibility and allocation safety
        run: node tests/verify-zip-restore-safety.cjs

      - name: Prisma schema doğrula
        working-directory: server
        run: npx prisma validate

      - name: Prisma Client üret
        working-directory: server
        run: npx prisma generate

      - name: Backend TypeScript build
        working-directory: server
        run: npm run build

  helpdesk-guards:
    name: Help Desk Yapısal Güvenlik Kontrolleri
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@v6

      - name: Node.js 24.21.0
        uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"

      - name: Help Desk beklenen guard ve yetkileri
        run: node tests/verify-helpdesk-structure.cjs
