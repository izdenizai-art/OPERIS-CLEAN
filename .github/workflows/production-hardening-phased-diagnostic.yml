name: Production Hardening Phased Diagnostic

on:
  push:
    branches: [ production-update-hardening-eee04356 ]
    paths: [ '.github/workflows/production-hardening-phased-diagnostic.yml' ]

permissions:
  contents: read

jobs:
  phased:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - name: Install Inno Setup compiler when missing
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe missing.' }
      - name: Build real setup EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\dist\installer -Force | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' .\installer\OPERIS.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno compile failed: $LASTEXITCODE" }
          if (-not (Test-Path .\dist\installer\OPERIS_Setup_v6.3.63.exe)) { throw 'setup exe missing' }
      - name: Phase clean
        shell: pwsh
        run: .\tests\windows\production-hardening-phased-diagnostic.ps1 -Phase clean -SetupExe (Resolve-Path .\dist\installer\OPERIS_Setup_v6.3.63.exe).Path
      - name: Phase same-version repair
        shell: pwsh
        run: .\tests\windows\production-hardening-phased-diagnostic.ps1 -Phase repair -SetupExe (Resolve-Path .\dist\installer\OPERIS_Setup_v6.3.63.exe).Path
      - name: Phase same-version refresh
        shell: pwsh
        run: .\tests\windows\production-hardening-phased-diagnostic.ps1 -Phase refresh -SetupExe (Resolve-Path .\dist\installer\OPERIS_Setup_v6.3.63.exe).Path
      - name: Phase concurrency
        shell: pwsh
        run: .\tests\windows\production-hardening-phased-diagnostic.ps1 -Phase concurrency -SetupExe (Resolve-Path .\dist\installer\OPERIS_Setup_v6.3.63.exe).Path
      - name: Phase simulated upgrade
        shell: pwsh
        run: .\tests\windows\production-hardening-phased-diagnostic.ps1 -Phase upgrade -SetupExe (Resolve-Path .\dist\installer\OPERIS_Setup_v6.3.63.exe).Path
      - name: Phase repair missing payload
        shell: pwsh
        run: .\tests\windows\production-hardening-phased-diagnostic.ps1 -Phase repair-missing -SetupExe (Resolve-Path .\dist\installer\OPERIS_Setup_v6.3.63.exe).Path
      - name: Phase startup backup
        shell: pwsh
        run: .\tests\windows\production-hardening-phased-diagnostic.ps1 -Phase startup-backup -SetupExe (Resolve-Path .\dist\installer\OPERIS_Setup_v6.3.63.exe).Path
      - name: Phase uninstall
        shell: pwsh
        run: .\tests\windows\production-hardening-phased-diagnostic.ps1 -Phase uninstall -SetupExe (Resolve-Path .\dist\installer\OPERIS_Setup_v6.3.63.exe).Path
      - name: Phase reinstall after uninstall
        shell: pwsh
        run: .\tests\windows\production-hardening-phased-diagnostic.ps1 -Phase reinstall-after-uninstall -SetupExe (Resolve-Path .\dist\installer\OPERIS_Setup_v6.3.63.exe).Path
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: operis-hardening-phased-${{ github.sha }}
          path: |
            ${{ runner.temp }}/operis-hardening-phase-state.json
            C:/ProgramData/Operis/Logs/*.log
          if-no-files-found: warn
          retention-days: 7
