name: OPERIS Windows PostgreSQL Rehearsal Safety

on:
  push:
    branches:
      - postgresql-candidate-validation
    paths:
      - "windows/**"
      - "server/prisma/schema.prisma"
      - "server/prisma/schema.postgresql.prisma"
      - "tests/windows/**"
      - ".github/workflows/operis-windows-postgresql-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-postgresql-rehearsal:
    name: Windows PostgreSQL provision + backup/restore rehearsal
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"

      - name: PostgreSQL provisioning safety
        shell: pwsh
        env:
          GITHUB_ACTIONS: "true"
        run: .\tests\windows\postgresql-provision-smoke.ps1

      - name: Windows installer PostgreSQL integration
        shell: pwsh
        env:
          GITHUB_ACTIONS: "true"
        run: .\tests\windows\enterprise-postgresql-integration.ps1 -Scenario clean
