# OPERİS v6.3.63 Sunucu Yayın Yapılandırması
# BIND_IP=ASK: Kurulum sırasında aktif IPv4 adresleri listelenir ve seçim istenir.
# İsterseniz kuruluma başlamadan önce aşağıdaki değeri doğrudan sunucunun IP adresi ile değiştirin.
# Örnek: BIND_IP=10.20.128.61
BIND_IP=ASK

# Güvenli varsayılan NO'dur. Mevcut OPERİS kurulumu normal upgrade/koruma akışında kalır.
# Yalnız bilinçli sıfır kurulum gerektiğinde ve geri dönüş yedeği doğrulandıktan sonra YES yapın.
FORCE_CLEAN_INSTALL=NO
